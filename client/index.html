<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sarca</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --sarca-ink: #1b1a19;
        --sarca-ink-soft: #605e5c;
        --sarca-paper: #eef0f2;
        --sarca-surface: #ffffff;
        --sarca-accent: #0078d4;
        --sarca-accent-deep: #005a9e;
        --sarca-border: rgba(0, 0, 0, 0.08);
        --sarca-shadow: 0 8px 24px rgba(0, 0, 0, 0.06), 0 1.5px 4px rgba(0, 0, 0, 0.04);
        --sarca-radius: 12px;
        --sarca-font: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
        --sarca-bg-top: #f5f6f8;
        --sarca-bg-bottom: #e6e8eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --sarca-ink: #ffffff;
          --sarca-ink-soft: #e0e0e0;
          --sarca-paper: #1c1c1c;
          --sarca-surface: #2b2b2b;
          --sarca-accent: #0078d4;
          --sarca-accent-deep: #005a9e;
          --sarca-border: rgba(255, 255, 255, 0.08);
          --sarca-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.2);
          --sarca-bg-top: #202020;
          --sarca-bg-bottom: #1c1c1c;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: var(--sarca-font);
        color: var(--sarca-ink);
        background:
          linear-gradient(180deg, var(--sarca-bg-top), var(--sarca-bg-bottom));
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }
      .auth-card {
        width: min(420px, 100%);
        background: var(--sarca-surface);
        border: 1px solid var(--sarca-border);
        border-radius: calc(var(--sarca-radius) + 4px);
        box-shadow: var(--sarca-shadow);
        padding: 28px 24px 24px;
      }
      .auth-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        text-align: center;
      }
      .auth-brand img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      .auth-brand h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .auth-brand p {
        margin: 0;
        color: var(--sarca-ink-soft);
        font-size: 0.95rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: var(--sarca-ink-soft);
        margin: 0 0 6px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid var(--sarca-border);
        background: color-mix(in srgb, var(--sarca-paper) 70%, var(--sarca-surface));
        color: var(--sarca-ink);
        font: inherit;
        margin-bottom: 14px;
      }
      input:focus {
        outline: 2px solid color-mix(in srgb, var(--sarca-accent) 45%, transparent);
        border-color: var(--sarca-accent);
      }
      button {
        width: 100%;
        margin-top: 4px;
        padding: 12px 16px;
        border: none;
        border-radius: 8px;
        background: var(--sarca-accent-deep);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--sarca-accent);
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      .error {
        margin: 0 0 12px;
        color: #c42b1c;
        font-size: 0.9rem;
        min-height: 1.2em;
      }
      .hint {
        margin: 16px 0 0;
        color: var(--sarca-ink-soft);
        font-size: 0.82rem;
        text-align: center;
        line-height: 1.4;
      }
      .platform {
        margin-top: 10px;
        text-align: center;
        font-size: 0.75rem;
        color: var(--sarca-ink-soft);
        opacity: 0.8;
      }
      .secondary-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 12px;
      }
      .secondary-actions button {
        width: 100%;
        margin-top: 0;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid var(--sarca-border);
        background: transparent;
        color: var(--sarca-ink);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .secondary-actions button:hover:not(:disabled) {
        background: color-mix(in srgb, var(--sarca-paper) 55%, transparent);
      }
      .secondary-actions button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <main class="auth-card">
      <div class="auth-brand">
        <img src="/logo.svg" alt="Sarca" />
        <h1>Sarca</h1>
        <p>Sign in to your cloud storage</p>
      </div>
      <form id="connectForm">
        <label for="serverUrl">Server</label>
        <input
          id="serverUrl"
          name="serverUrl"
          type="text"
          inputmode="url"
          autocomplete="url"
          placeholder="http://192.168.1.10:8000 or https://sarca.example.com"
          required
        />
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          required
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <p id="error" class="error" aria-live="polite"></p>
        <button id="submit" type="submit">Connect</button>
      </form>
      <div class="secondary-actions">
        <button type="button" id="openSync" disabled title="Connect first">
          Sync settings
        </button>
      </div>
      <p class="hint">
        After connecting you get the same Sarca interface as in the browser —
        files, buttons, and settings. Use <strong>Sync settings</strong> for
        Media auto-upload and folder sync (also in the app menu / Sync button).
      </p>
      <p id="platform" class="platform"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
