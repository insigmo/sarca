[package]
name = "sarca-client"
version = "0.0.143"
description = "Sarca desktop/mobile sync client"
authors = ["Sarca"]
edition = "2021"
license = "MIT"
repository = "https://github.com/insigmo/sarca"
readme = "../../README.md"
keywords = ["storage", "sync", "telegram"]
categories = ["gui"]

[lib]
name = "sarca_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds tauri-plugin-pilot so `tauri-pilot` can drive the app in e2e tests.
# Off by default: release bundles never compile the plugin or its deps.
pilot = ["dep:tauri-plugin-pilot"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
# Prefer HTTP/3 (QUIC) on all platforms, including Android/iOS NDK.
sarca-sync = { path = "../../crates/sarca-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
network-interface = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-notification = "2"
# e2e driver plugin — see the `pilot` feature. `press` is dropped: the e2e suite
# drives the UI through click/fill/eval, and enigo pulls in X11/Wayland input
# stacks that CI containers do not have.
# Pinned by `rev`, not `tag`: a git tag is mutable, so an upstream force-push
# would silently swap the code behind a name Cargo would happily re-resolve.
# The rev is v0.7.2's commit; bump both together.
tauri-plugin-pilot = { git = "https://github.com/mpiton/tauri-pilot", rev = "a6c5baa3f280fe75e75220be8e7689785a200d13", default-features = false, optional = true }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
hostname = "0.4"
base64 = "0.22"
hex = "0.4"
# App-lock PIN hashing (see state::ClientPrefs).
sha2 = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"

[dev-dependencies]
tauri-utils = { version = "2", default-features = false }
tempfile = "3"
url = "2"
