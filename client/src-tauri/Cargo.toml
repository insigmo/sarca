[package]
name = "sarca-client"
version = "0.0.81"
description = "Sarca desktop/mobile sync client"
authors = ["Sarca"]
edition = "2021"
license = "MIT"
repository = "https://github.com/insigmo/sarca"
readme = "../../README.md"
keywords = ["storage", "sync", "telegram"]
categories = ["gui"]

[lib]
name = "sarca_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
sarca-sync = { path = "../../crates/sarca-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
network-interface = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
hostname = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tauri-utils = { version = "2", default-features = false }
url = "2"
