[build]
rustflags = ["--cfg", "reqwest_unstable"]

# Tauri Android sets RUSTFLAGS at build time, which overrides ALL rustflags
# from this file (both [build] and [target.*]) — so target-specific tables
# here are silently ignored on Android builds. Keep reqwest HTTP/3 cfg via
# these tables anyway for non-Tauri cargo invocations (cargo check/build
# directly); the 16KB page-size linker flag lives in client/src-tauri/build.rs
# instead, via cargo:rustc-link-arg, which survives the RUSTFLAGS override.
[target.aarch64-linux-android]
rustflags = ["--cfg", "reqwest_unstable"]

[target.armv7-linux-androideabi]
rustflags = ["--cfg", "reqwest_unstable"]

[target.i686-linux-android]
rustflags = ["--cfg", "reqwest_unstable"]

[target.x86_64-linux-android]
rustflags = ["--cfg", "reqwest_unstable"]

[target.aarch64-apple-ios]
rustflags = ["--cfg", "reqwest_unstable"]

[target.x86_64-apple-ios]
rustflags = ["--cfg", "reqwest_unstable"]

[target.aarch64-apple-ios-sim]
rustflags = ["--cfg", "reqwest_unstable"]
