version: "3"

# Cross-platform notes
#
# Task runs `cmds` through its own embedded shell, not through bash or
# PowerShell. On Windows that shell ships only a few coreutils
# (mkdir/cp/rm/mv/chmod/touch/cat/ls/tar/gzip) — sed, grep, head, cut, tr and
# friends are simply not there, and `cp -a` is not accepted either. Every
# command below therefore either sticks to what the embedded shell can do on
# every host, or splits per platform: POSIX tools under
# `platforms: [linux, darwin]`, a PowerShell script under `platforms: [windows]`.

vars:
  # POSIX: XDG-ish share dir. Windows: the prefix install.ps1 uses.
  NATIVE_PREFIX:
    sh: 'if [ "{{OS}}" = "windows" ]; then echo "${LOCALAPPDATA}\\Sarca"; else echo "${HOME}/.local/share/sarca"; fi'
  # Compose interpolates ${PORT} from sarca.conf (host publish + container listen).
  # Base compose.yml is pull-only; compose.dev.yml bind-mounts local runtime/sarca + ui/dist.
  COMPOSE: docker compose -f compose.yml -f compose.dev.yml --env-file sarca.conf
  # Source before any pnpm invocation — Task often has a minimal non-login PATH.
  ENSURE_PNPM: '. "{{.ROOT_DIR}}/scripts/ensure-pnpm-env.sh"'
  # Source before any venv invocation — sets VENV_PY (bin/ or Scripts/ per host).
  ENSURE_VENV: '. "{{.ROOT_DIR}}/scripts/ensure-venv.sh" "{{.ROOT_DIR}}/.venv"'
  # Windows has no POSIX toolbox; whatever needs one runs as a .ps1.
  PS: powershell -NoProfile -ExecutionPolicy Bypass -File

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all
    silent: true

  ui:
    desc: Build web UI into ui/dist
    cmds:
      - |
        {{.ENSURE_PNPM}}
        UI_DIR="{{.ROOT_DIR}}/ui"
        (cd "$UI_DIR" && VITE_API_BASE=/api $PNPM install && VITE_API_BASE=/api $PNPM run build)

  binary:
    desc: Lint (fmt+clippy) then build the Linux release binary into runtime/sarca
    deps: [lint]
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/runtime"
      - cmd: |
          cd "{{.ROOT_DIR}}"
          cargo build --release -p sarca
          BIN="$(cargo metadata --format-version 1 --no-deps 2>/dev/null | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')"
          if [ -z "$BIN" ]; then BIN=target; fi
          SRC="$BIN/release/sarca"
          DEST="{{.ROOT_DIR}}/runtime/sarca"
          if cp -f "$SRC" "$DEST" 2>/dev/null; then
            chmod +x "$DEST"
          else
            # runtime/sarca may be root-owned from a prior Docker copy
            docker run --rm \
              -v "{{.ROOT_DIR}}/runtime:/runtime" \
              -v "$SRC:/bin-src:ro" \
              alpine sh -c 'cp /bin-src /runtime/sarca && chmod 755 /runtime/sarca'
          fi
          echo "binary → $DEST"
        platforms: [linux, darwin]
      # `task up` bind-mounts runtime/sarca into the Linux container, so a
      # native Windows .exe is unusable there — compile inside a Linux Rust
      # image instead (Docker is required by `up` anyway). `task deploy-native`
      # is the one that builds a real sarca.exe on Windows.
      - cmd: '{{.PS}} "{{.ROOT_DIR}}/scripts/build-linux-binary.ps1" -RootDir "{{.ROOT_DIR}}"'
        platforms: [windows]

  lint:
    desc: Strict rustfmt (nightly) + clippy (deny pedantic/nursery/cargo)
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo +nightly fmt -p sarca -- --check
      - cargo +stable clippy -p sarca --all-targets --all-features -- -D warnings

  fmt:
    desc: Apply strict rustfmt (nightly unstable options)
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo +nightly fmt -p sarca

  deploy-ui-native:
    desc: Copy ui/dist into native install prefix
    deps: [ui]
    cmds:
      # Neither `cp -a` nor a `dir/*` glob survives the Windows coreutils;
      # replacing the directory outright behaves the same on every host.
      - |
        PREFIX="{{.NATIVE_PREFIX}}"
        mkdir -p "$PREFIX"
        rm -rf "$PREFIX/ui"
        cp -r "{{.ROOT_DIR}}/ui/dist" "$PREFIX/ui"
        echo "native UI → $PREFIX/ui"

  deploy-native:
    desc: Install local binary + UI into the native prefix (~/.local/share/sarca, %LOCALAPPDATA%\Sarca)
    cmds:
      - task: deploy-native:posix
      - task: deploy-native:windows

  deploy-native:posix:
    internal: true
    platforms: [linux, darwin]
    deps: [binary, deploy-ui-native]
    cmds:
      - |
        PREFIX="{{.NATIVE_PREFIX}}"
        mkdir -p "$PREFIX"
        cp -f "{{.ROOT_DIR}}/runtime/sarca" "$PREFIX/sarca"
        chmod +x "$PREFIX/sarca"
        echo "native binary → $PREFIX/sarca"

  deploy-native:windows:
    internal: true
    platforms: [windows]
    # Not `binary`: that one produces the Linux ELF the Docker stack needs. A
    # native install wants a real sarca.exe, which the script builds itself.
    deps: [lint, deploy-ui-native]
    cmds:
      - '{{.PS}} "{{.ROOT_DIR}}/scripts/install-native.ps1" -RootDir "{{.ROOT_DIR}}" -Prefix "{{.NATIVE_PREFIX}}"'

  up:
    desc: Build binary+UI and start Docker stack (compose.yml + compose.dev.yml)
    deps: [ui, binary]
    cmds:
      # Compose invokes the entrypoint as `/bin/sh /sarca-entrypoint.sh`, so
      # the exec bit only matters where the host filesystem carries one.
      - cmd: chmod +x "{{.ROOT_DIR}}/docker/sarca-entrypoint.sh"
        platforms: [linux, darwin]
      # Go's stat reports no exec bit for Windows files, so -x can never match
      # there; the -f checks below hold on every host.
      - cmd: test -x "{{.ROOT_DIR}}/runtime/sarca"
        platforms: [linux, darwin]
      - test -f "{{.ROOT_DIR}}/runtime/sarca" -a ! -d "{{.ROOT_DIR}}/runtime/sarca"
      - test -f "{{.ROOT_DIR}}/ui/dist/index.html"
      - test -f "{{.ROOT_DIR}}/sarca.conf"
      - "{{.COMPOSE}} up -d --build --force-recreate --remove-orphans"

  down:
    desc: Stop and remove stack
    cmds:
      - "{{.COMPOSE}} down"

  restart:
    desc: Restart stack with fresh binary+UI
    cmds:
      - task: down
      - task: up

  docker:buildx:
    desc: Create/bootstrap the local buildx builder (docker-container driver + QEMU)
    cmds:
      - |
        # Task runs this through its own shell interpreter, so everything here
        # sticks to builtins — sed/tr/head are not on PATH under plain PowerShell.
        BUILDER="${SARCA_BUILDER:-sarca-multiarch}"
        PLATFORMS="{{.PLATFORMS}}"; PLATFORMS="${PLATFORMS:-linux/amd64,linux/arm64}"
        if ! docker buildx inspect "$BUILDER" >/dev/null 2>&1; then
          docker buildx create --name "$BUILDER" --driver docker-container >/dev/null
          echo "created buildx builder $BUILDER"
        fi
        INSPECT="$(docker buildx inspect "$BUILDER" --bootstrap)"
        MISSING=""
        OLD_IFS="$IFS"; IFS=','
        for p in $PLATFORMS; do
          case "$INSPECT" in
            *"$p"*) ;;
            *) MISSING="$MISSING $p" ;;
          esac
        done
        IFS="$OLD_IFS"
        if [ -n "$MISSING" ]; then
          # Docker Desktop ships the emulators; a plain Linux dockerd needs the
          # binfmt_misc handlers registered first — the same image CI gets from
          # docker/setup-qemu-action.
          echo "registering QEMU emulators for:$MISSING"
          docker run --privileged --rm tonistiigi/binfmt:latest --install all
          docker buildx inspect "$BUILDER" --bootstrap >/dev/null
        fi
        echo "builder $BUILDER ready for $PLATFORMS"

  docker:image:
    desc: "Build the GHCR image for amd64+arm64 like docker-image.yml (VERSION=v0.0.6 PLATFORMS=linux/arm64 PUSH=true)"
    deps: [docker:buildx]
    cmds:
      - |
        cd "{{.ROOT_DIR}}"
        BUILDER="${SARCA_BUILDER:-sarca-multiarch}"
        # The Dockerfile curls sarca_linux_${arch}.tar.gz off the GitHub release,
        # so VERSION has to be a published tag (or `latest`) — nothing is compiled
        # here, this only reproduces the packaging CI does.
        VERSION="{{.VERSION}}"; VERSION="${VERSION:-latest}"
        REPO="{{.REPO}}"; REPO="${REPO:-insigmo/sarca}"
        # GHCR requires lowercase image names
        IMAGE="{{.IMAGE}}"; IMAGE="${IMAGE:-ghcr.io/${REPO,,}}"
        PLATFORMS="{{.PLATFORMS}}"; PLATFORMS="${PLATFORMS:-linux/amd64,linux/arm64}"
        PUSH="{{.PUSH}}"; PUSH="${PUSH:-false}"
        set -- --builder "$BUILDER" --platform "$PLATFORMS" --file docker/Dockerfile
        set -- "$@" --build-arg "VERSION=$VERSION" --build-arg "GITHUB_REPO=$REPO"
        set -- "$@" --label "org.opencontainers.image.source=https://github.com/$REPO"
        set -- "$@" --label "org.opencontainers.image.version=$VERSION"
        set -- "$@" --label org.opencontainers.image.title=sarca
        set -- "$@" --tag "$IMAGE:$VERSION" --provenance=false
        # A multi-arch result cannot enter the local image store, so it stays in
        # the build cache unless pushed; a single platform is --load'ed so the
        # image is there to `docker run`.
        if [ "$PUSH" = "true" ]; then
          set -- "$@" --push
        elif [ "$PLATFORMS" = "${PLATFORMS%,*}" ]; then
          set -- "$@" --load
        else
          echo "note: multi-arch build stays in the build cache — pass PUSH=true (docker login ghcr.io first) or a single PLATFORMS to keep the image"
        fi
        docker buildx build "$@" .
        echo "built $IMAGE:$VERSION for $PLATFORMS"


  docker:deploy:
    desc: "Build the image, scp it to the server and restart the stack there (HOST=beta@sarca.qwantone.com VERSION=v0.0.6)"
    cmds:
      # A multi-arch build never lands in the local image store, so `docker save`
      # would have nothing to write — the deploy always builds a single platform,
      # the server's.
      - task: docker:image
        vars:
          PLATFORMS: '{{.PLATFORMS | default "linux/amd64"}}'
          VERSION: "{{.VERSION}}"
          REPO: "{{.REPO}}"
          IMAGE: "{{.IMAGE}}"
      - |
        cd "{{.ROOT_DIR}}"
        VERSION="{{.VERSION}}"; VERSION="${VERSION:-latest}"
        REPO="{{.REPO}}"; REPO="${REPO:-insigmo/sarca}"
        IMAGE="{{.IMAGE}}"; IMAGE="${IMAGE:-ghcr.io/${REPO,,}}"
        HOST="{{.HOST}}"; HOST="${HOST:-beta@sarca.qwantone.com}"
        REMOTE_DIR="{{.REMOTE_DIR}}"; REMOTE_DIR="${REMOTE_DIR:-~/git/sarca}"
        TAR="sarca-image.tar"
        echo "saving $IMAGE:$VERSION → {{.ROOT_DIR}}/$TAR"
        docker save "$IMAGE:$VERSION" -o "$TAR"
        echo "copying $TAR → $HOST:/tmp/$TAR"
        if ! scp "$TAR" "$HOST:/tmp/$TAR"; then rm -f "$TAR"; exit 1; fi
        rm -f "$TAR"
        ssh "$HOST" "docker load -i /tmp/$TAR && rm -f /tmp/$TAR"
        # $3 is escaped so awk — not the local shell — gets it.
        ssh "$HOST" "cd ~/git/sarca && git pull && docker compose down && docker compose up -d"
        echo "deployed $IMAGE:$VERSION → $HOST:$REMOTE_DIR"

  db:reset:
    desc: Delete SQLite database file and restart Sarca to recreate schema+superuser
    prompt: Wipe ALL Sarca SQLite data? This cannot be undone.
    cmds:
      - cmd: chmod +x "{{.ROOT_DIR}}/scripts/db-reset.sh"
        platforms: [linux, darwin]
      - cmd: "{{.ROOT_DIR}}/scripts/db-reset.sh"
        platforms: [linux, darwin]
      # Same steps without sed/grep/curl, and Windows cannot exec a .sh anyway.
      - cmd: '{{.PS}} "{{.ROOT_DIR}}/scripts/db-reset.ps1" -RootDir "{{.ROOT_DIR}}"'
        platforms: [windows]

  smoke:
    desc: Upload sample image+video against running API (SARCA_BASE_URL); `task e2e` covers it on the mock
    cmds:
      - |
        cd "{{.ROOT_DIR}}"
        {{.ENSURE_VENV}}
        "$VENV_PY" -m pip install -q -r e2e/requirements.txt
        # grep/head/cut/tr do not exist in Task's Windows shell — a read loop
        # plus parameter expansion needs no external tool on any host.
        PORT=""
        while IFS= read -r line; do
          case "$line" in
            PORT=*) PORT="${line#PORT=}" ;;
          esac
        done < sarca.conf
        # strip trailing CR / spaces without tr
        PORT="${PORT%%[[:space:]]*}"
        PORT="${PORT:-8000}"
        unset SUPERUSER_EMAIL SUPERUSER_PASS
        SARCA_BASE_URL="${SARCA_BASE_URL:-http://127.0.0.1:${PORT}}" \
          "$VENV_PY" -m pytest -q -m smoke e2e/test_upload_smoke.py -s

  e2e:
    desc: API/server e2e suite, GUI excluded (own server + fake Telegram Bot API); see e2e/README.md
    cmds:
      - |
        cd "{{.ROOT_DIR}}"
        {{.ENSURE_VENV}}
        "$VENV_PY" -m pip install -q -r e2e/requirements.txt
        cargo build --release -p sarca
        cargo build -p sarca-sync --example headless
        cd e2e
        # `env -u` is not on PATH on every host Task runs on; `unset` is a builtin.
        unset SUPERUSER_EMAIL SUPERUSER_PASS PORT SARCA_BASE_URL
        # `gui` belongs to e2e:gui, which builds the prerequisites this task
        # does not (client/dist, the pilot client, tauri-pilot). It used to
        # deselect itself by way of a missing DISPLAY, which only held on a
        # headless Linux box. A later -m in CLI_ARGS overrides this one.
        SARCA_SKIP_BUILD=1 "$VENV_PY" -m pytest -m "not gui" {{.CLI_ARGS}}

  e2e:gui:
    desc: GUI e2e — drives the real Tauri client through tauri-pilot (Xvfb when headless)
    deps: [ui, client:ui]
    cmds:
      - |
        cd "{{.ROOT_DIR}}"
        {{.ENSURE_VENV}}
        "$VENV_PY" -m pip install -q -r e2e/requirements.txt
        command -v tauri-pilot >/dev/null 2>&1 || cargo install tauri-pilot-cli --locked
        cargo build --release -p sarca
        # The pilot plugin is debug-only and feature-gated, so the client the
        # tests drive is a debug build with `--features pilot`.
        cargo build -p sarca-client --features pilot
        cd e2e
        unset SUPERUSER_EMAIL SUPERUSER_PASS PORT SARCA_BASE_URL
        export SARCA_SKIP_BUILD=1
        # Only X11/Wayland hosts need a virtual display; Windows and macOS
        # draw the client through the native compositor.
        if [ "{{OS}}" = "windows" ] || [ "{{OS}}" = "darwin" ] || [ -n "${DISPLAY}${WAYLAND_DISPLAY}" ]; then
          "$VENV_PY" -m pytest -m gui {{.CLI_ARGS}}
        else
          xvfb-run -a -s "-screen 0 1280x900x24" "$VENV_PY" -m pytest -m gui {{.CLI_ARGS}}
        fi

  ico:update:
    desc: Regenerate ui/client logo.svg copies and all Tauri client icons from root logo.svg
    deps: [client:install]
    cmds:
      - cp "{{.ROOT_DIR}}/logo.svg" "{{.ROOT_DIR}}/ui/src/assets/logo.svg"
      - cp "{{.ROOT_DIR}}/logo.svg" "{{.ROOT_DIR}}/client/public/logo.svg"
      - |
        {{.ENSURE_PNPM}}
        cd "{{.ROOT_DIR}}/client"
        $PNPM exec tauri icon "{{.ROOT_DIR}}/logo.svg"
      - |
        cd "{{.ROOT_DIR}}"
        # The repo venv resolves on every host (bin/ or Scripts/), unlike the
        # hardcoded .venv/bin path or a bare `python3` — on Windows the latter
        # is usually the Store stub.
        {{.ENSURE_VENV}}
        "$VENV_PY" -m pip install -q pillow
        "$VENV_PY" scripts/gen-android-icons.py
      - echo "icons regenerated from {{.ROOT_DIR}}/logo.svg"

  client:install:
    desc: Install client frontend deps (pnpm)
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM install

  client:ui:
    desc: Build Tauri webview UI (client/dist)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM build

  client:check-sync:
    desc: Test sarca-sync crate
    cmds:
      - cargo test -p sarca-sync

  client:build:
    desc: Build Sarca Tauri client for the host (needs WebKit/GTK on Linux)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri build

  install:
    desc: Build Linux .deb client and install locally (sudo apt-get; prompts for password)
    platforms: [linux]
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM run install:deb

  client:build:linux-amd64:
    desc: Build Linux amd64 client bundle
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri build --target x86_64-unknown-linux-gnu

  client:build:linux-arm64:
    desc: Build Linux arm64 client bundle (cross)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri build --target aarch64-unknown-linux-gnu

  client:build:windows-amd64:
    desc: Build Windows amd64 client (cross / on Windows)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri build --target x86_64-pc-windows-msvc

  client:build:windows-arm64:
    desc: Build Windows arm64 client
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri build --target aarch64-pc-windows-msvc

  client:build:macos-arm64:
    desc: Build macOS Apple Silicon client (run on macOS)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri build --target aarch64-apple-darwin

  client:build:macos-amd64:
    desc: Build macOS Intel client (cross-compiled from an Apple Silicon Mac)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri build --target x86_64-apple-darwin

  client:android:
    desc: Build Android APK (requires Android SDK + tauri android init)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri android build

  client:ios:
    desc: Build iOS app (requires macOS + Xcode + tauri ios init)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri ios build
