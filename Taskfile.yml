version: "3"

vars:
  NATIVE_PREFIX:
    sh: 'echo "${HOME}/.local/share/sarca"'
  # Compose interpolates ${PORT} from sarca.conf (host publish + container listen).
  # Base compose.yml is pull-only; compose.dev.yml bind-mounts local runtime/sarca + ui/dist.
  COMPOSE: docker compose -f compose.yml -f compose.dev.yml --env-file sarca.conf
  # Source before any pnpm invocation — Task often has a minimal non-login PATH.
  ENSURE_PNPM: '. "{{.ROOT_DIR}}/scripts/ensure-pnpm-env.sh"'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all
    silent: true

  ui:
    desc: Build web UI into ui/dist
    cmds:
      - |
        {{.ENSURE_PNPM}}
        UI_DIR="{{.ROOT_DIR}}/ui"
        (cd "$UI_DIR" && VITE_API_BASE=/api $PNPM install && VITE_API_BASE=/api $PNPM run build)

  binary:
    desc: Lint (fmt+clippy) then build release binary into runtime/sarca
    deps: [lint]
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/runtime"
      - |
        cd "{{.ROOT_DIR}}"
        cargo build --release -p sarca
        BIN="$(cargo metadata --format-version 1 --no-deps 2>/dev/null | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')"
        if [ -z "$BIN" ]; then BIN=target; fi
        SRC="$BIN/release/sarca"
        DEST="{{.ROOT_DIR}}/runtime/sarca"
        if cp -f "$SRC" "$DEST" 2>/dev/null; then
          chmod +x "$DEST"
        else
          # runtime/sarca may be root-owned from a prior Docker copy
          docker run --rm \
            -v "{{.ROOT_DIR}}/runtime:/runtime" \
            -v "$SRC:/bin-src:ro" \
            alpine sh -c 'cp /bin-src /runtime/sarca && chmod 755 /runtime/sarca'
        fi
        echo "binary → $DEST"

  lint:
    desc: Strict rustfmt (nightly) + clippy (deny pedantic/nursery/cargo)
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo +nightly fmt -p sarca -- --check
      - cargo +stable clippy -p sarca --all-targets --all-features -- -D warnings

  fmt:
    desc: Apply strict rustfmt (nightly unstable options)
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo +nightly fmt -p sarca

  deploy-ui-native:
    desc: Copy ui/dist into native install prefix
    deps: [ui]
    cmds:
      - |
        PREFIX="{{.NATIVE_PREFIX}}"
        mkdir -p "$PREFIX/ui"
        rm -rf "$PREFIX/ui"/*
        cp -a "{{.ROOT_DIR}}/ui/dist/." "$PREFIX/ui/"
        echo "native UI → $PREFIX/ui"

  deploy-native:
    desc: Install local binary + UI into ~/.local/share/sarca
    deps: [binary, deploy-ui-native]
    cmds:
      - |
        PREFIX="{{.NATIVE_PREFIX}}"
        mkdir -p "$PREFIX"
        cp -f "{{.ROOT_DIR}}/runtime/sarca" "$PREFIX/sarca"
        chmod +x "$PREFIX/sarca"
        echo "native binary → $PREFIX/sarca"

  up:
    desc: Build binary+UI and start Docker stack (compose.yml + compose.dev.yml)
    deps: [ui, binary]
    cmds:
      - chmod +x "{{.ROOT_DIR}}/docker/sarca-entrypoint.sh"
      - test -x "{{.ROOT_DIR}}/runtime/sarca"
      - test -f "{{.ROOT_DIR}}/runtime/sarca" -a ! -d "{{.ROOT_DIR}}/runtime/sarca"
      - test -f "{{.ROOT_DIR}}/ui/dist/index.html"
      - test -f "{{.ROOT_DIR}}/sarca.conf"
      - "{{.COMPOSE}} up -d --build --force-recreate --remove-orphans"

  down:
    desc: Stop and remove stack
    cmds:
      - "{{.COMPOSE}} down"

  restart:
    desc: Restart stack with fresh binary+UI
    cmds:
      - task: down
      - task: up

  db:reset:
    desc: Wipe all Postgres data (DROP SCHEMA) and restart Sarca to recreate schema+superuser
    prompt: Wipe ALL Sarca DB data in Docker Postgres? This cannot be undone.
    cmds:
      - chmod +x "{{.ROOT_DIR}}/scripts/db-reset.sh"
      - "{{.ROOT_DIR}}/scripts/db-reset.sh"

  smoke:
    desc: Upload sample image+video against running API (SARCA_BASE_URL)
    cmds:
      - |
        cd "{{.ROOT_DIR}}"
        if [ ! -d .venv ]; then python3 -m venv .venv; .venv/bin/pip install -r e2e/requirements.txt; fi
        PORT="$(grep -E '^[[:space:]]*PORT=' sarca.conf 2>/dev/null | head -1 | cut -d= -f2- | tr -d '[:space:]')"
        PORT="${PORT:-8000}"
        env -u SUPERUSER_EMAIL -u SUPERUSER_PASS \
          SARCA_BASE_URL="${SARCA_BASE_URL:-http://127.0.0.1:${PORT}}" \
          .venv/bin/python -m pytest -q -m smoke e2e/test_upload_smoke.py -s

  client:install:
    desc: Install client frontend deps (pnpm)
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM install

  client:ui:
    desc: Build Tauri webview UI (client/dist)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM build

  client:check-sync:
    desc: Test sarca-sync crate
    cmds:
      - cargo test -p sarca-sync

  client:build:
    desc: Build Sarca Tauri client for the host (needs WebKit/GTK on Linux)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri build

  install:
    desc: Build Linux .deb client and install locally (sudo apt-get; prompts for password)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM run install:deb

  client:build:linux-amd64:
    desc: Build Linux amd64 client bundle
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri build --target x86_64-unknown-linux-gnu

  client:build:linux-arm64:
    desc: Build Linux arm64 client bundle (cross)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri build --target aarch64-unknown-linux-gnu

  client:build:windows-amd64:
    desc: Build Windows amd64 client (cross / on Windows)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri build --target x86_64-pc-windows-msvc

  client:build:windows-arm64:
    desc: Build Windows arm64 client
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri build --target aarch64-pc-windows-msvc

  client:build:macos-arm64:
    desc: Build macOS Apple Silicon client (run on macOS)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri build --target aarch64-apple-darwin

  client:android:
    desc: Build Android APK (requires Android SDK + tauri android init)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri android build

  client:ios:
    desc: Build iOS app (requires macOS + Xcode + tauri ios init)
    deps: [client:install]
    dir: client
    cmds:
      - |
        {{.ENSURE_PNPM}}
        $PNPM tauri ios build
