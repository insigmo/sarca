# Optional Docker deploy — single Sarca container (SQLite + in-process TLS/ACME).
# Binary install is the primary path; see install.sh (default) or install.sh --docker.
services:
  sarca:
    container_name: sarca
    image: ghcr.io/insigmo/sarca:latest
    volumes:
      - ./sarca.conf:/sarca.conf:ro
      - ./docker/sarca-entrypoint.sh:/sarca-entrypoint.sh:ro
      - sarca-work-volume:/work
    entrypoint: ["/bin/sh", "/sarca-entrypoint.sh"]
    environment:
      WORK_DIR: /work
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
      - "443:443"
      - "443:443/udp"
      - "80:80"
    env_file:
      - sarca.conf
    restart: unless-stopped

volumes:
  sarca-work-volume:
    name: sarca-work-volume
