[package]
name = "sarca"
version = "0.0.140"
edition = "2021"
description = "Self-hosted cloud storage that keeps files in Telegram channels"
license = "MIT"
repository = "https://github.com/insigmo/sarca"
readme = "../README.md"
keywords = ["storage", "telegram", "self-hosted"]
categories = ["web-programming"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "sarca"
path = "src/main.rs"

# Strict Clippy: all + pedantic + nursery + cargo as deny.
# Only allow lints that are impractical for this Axum/SQL architecture.
[lints.rust]
unsafe_code = "forbid"
# Application crate shared by the binary and integration tests — not a public API.
# Requiring Debug on every exported type is noise after introducing [lib].
missing_debug_implementations = "allow"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
# Axum handlers / service methods return large futures by design.
large_futures = "allow"
# SQL strings prefer r#"…"# even when # is unnecessary.
needless_raw_string_hashes = "allow"
# Many small helpers are not const-safe once they touch non-const APIs; noise.
missing_const_for_fn = "allow"
# Byte offsets / Telegram sizes / JPEG dims — casts are intentional.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Axum handler signatures stay `async` for uniformity even without await.
unused_async = "allow"
# Large request buffers / zip builders.
# Application lib surface (binary + integration tests): pedantic docs/must_use noise.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
large_stack_frames = "allow"
# Keep statement order readable next to SQL / match arms.
items_after_statements = "allow"
# Serde / public JSON field names.
struct_field_names = "allow"

[dependencies]
# routing
axum = { version = "0.8", features = ["macros", "multipart"] }
mime_guess = "2.0.4"
tower = { version = "0.5", features = ["limit", "util"], default-features = false }
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "set-header"], default-features = false }

# TLS / HTTP/3
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
h3-axum = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
rcgen = "0.13"
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring"] }
x509-parser = "0.17"

# serialization/deserialization
serde = { version = "1.0.189", features = ["derive"] }
serde_json = "1.0"

# auth
pwhash = "1.0.0"
# 10.x fixes GHSA-h395-gr6q-cpjc (claim type confusion skipped validation).
# Exactly one crypto provider may be on, or every sign/verify panics; aws_lc_rs
# is already in the tree via rustls, and picking it keeps the `rsa` crate
# (RUSTSEC-2023-0071, Marvin) out of the build entirely. Only HS256 is used.
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.10"

# async
tokio = { version = "1.33.0", features = ["full"] }
tokio-util = { version = "0.7.10", features = ["io"] }
futures = "0.3.29"
async-stream = "0.3.5"

# logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }

# others
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "sqlite", "uuid", "chrono"] }
thiserror = "1.0.50"
uuid = { version = "1.5.0", features = ["serde", "v4"] }

# HTTP client (без native-tls — ок для musl)
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "stream", "rustls-tls"] }
percent-encoding = "2.3"

# thumbnails
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

# folder download as zip
zip = { version = "2.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4.45", features = ["clock", "serde"] }

[dev-dependencies]
# `test-util` gives tests the paused clock used by the supervisor backoff test.
tokio = { version = "1.33.0", features = ["full", "test-util"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = "0.11"
tempfile = "3"
