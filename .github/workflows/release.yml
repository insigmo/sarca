name: Release binaries

# Auto-release on every push to master (patch bump), or manually with a bump type.
# Manual tags (v*) still work. Version in Cargo.toml / package.json is updated by CI.
on:
  push:
    branches: ["master"]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump when releasing from a branch"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

jobs:
  # Skip auto-release for the bot commit that only bumps version files.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          set -uo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log -1 --pretty=%s | grep -qE '^chore: release v'; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping version-bump commit"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [guard]
    if: needs.guard.outputs.proceed == 'true'
    uses: ./.github/workflows/e2e.yml

  version:
    needs: [guard, e2e]
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve next version
        id: meta
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: |
          set -uo pipefail

          # Tag push: use the tag as-is, do not bump or commit.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Using existing tag ${TAG}"
            exit 0
          fi

          LATEST="$(git tag -l 'v*' --sort=-v:refname | head -1 || true)"
          if [[ -z "${LATEST}" ]]; then
            MAJOR=0; MINOR=0; PATCH=0
          else
            RAW="${LATEST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<<"${RAW}"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          fi

          case "${BUMP}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Unknown bump: ${BUMP}" >&2; exit 1 ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi

          # Keep package manifests in sync with the release tag.
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" sarca/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" client/src-tauri/Cargo.toml
          python3 - <<PY
          import json, pathlib, re
          for path in [
              pathlib.Path("ui/package.json"),
              pathlib.Path("client/package.json"),
          ]:
              data = json.loads(path.read_text())
              data["version"] = "${VERSION}"
              path.write_text(json.dumps(data, indent=2) + "\n")
          conf = pathlib.Path("client/src-tauri/tauri.conf.json")
          text = conf.read_text()
          text = re.sub(r'"version"\s*:\s*"[^"]*"', '"version": "${VERSION}"', text, count=1)
          conf.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sarca/Cargo.toml ui/package.json client/package.json client/src-tauri/Cargo.toml client/src-tauri/tauri.conf.json
          git commit -m "chore: release ${TAG}"
          git tag "${TAG}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "${TAG}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Prepared ${TAG} (bump=${BUMP}, previous=${LATEST:-none})"

  build-ui:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build UI
        working-directory: ui
        env:
          VITE_API_BASE: /api
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/upload-artifact@v6
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  # Compile server binaries in parallel with build-ui / build-client.
  # UI bundling happens in `package` (needs build-ui), not here.
  build:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin Linux to 22.04 so release binaries need GLIBC ≤ 2.35 and run on
          # Bookworm/older hosts; ubuntu-latest (24.04) would require GLIBC 2.39.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset: sarca_linux_amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            asset: sarca_linux_arm64
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: sarca_windows_amd64
            binary: sarca.exe
          - target: aarch64-apple-darwin
            os: macos-14
            asset: sarca_macos_arm64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux aarch64 cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-server-${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p sarca --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v6
        with:
          name: server-bin-${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary || 'sarca' }}
          if-no-files-found: error
          retention-days: 1

  # Bundle compiled server binaries with the UI dist (after build-ui).
  package:
    needs: [version, build, build-ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: sarca_linux_amd64
            archive: tar.gz
          - asset: sarca_linux_arm64
            archive: tar.gz
          - asset: sarca_windows_amd64
            archive: zip
            binary: sarca.exe
          - asset: sarca_macos_arm64
            archive: tar.gz

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: server-bin-${{ matrix.asset }}
          path: bin

      - uses: actions/download-artifact@v7
        with:
          name: ui-dist
          path: package/ui

      - name: Package artifact
        env:
          ASSET: ${{ matrix.asset }}
          ARCHIVE: ${{ matrix.archive }}
          BINARY_NAME: ${{ matrix.binary || 'sarca' }}
        run: |
          set -uo pipefail
          mkdir -p "dist/${ASSET}"
          cp "bin/${BINARY_NAME}" "dist/${ASSET}/"
          cp -r package/ui "dist/${ASSET}/ui"
          cd dist
          if [ "${ARCHIVE}" = "zip" ]; then
            zip -r "${ASSET}.zip" "${ASSET}"
            ARTIFACT="${ASSET}.zip"
          else
            tar -czf "${ASSET}.tar.gz" "${ASSET}"
            ARTIFACT="${ASSET}.tar.gz"
          fi
          echo "Packed ${ARTIFACT}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  # Native sync clients (Tauri) — parallel with server compile (`build`).
  build-client:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb
            asset: sarca_client_linux_amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb
            asset: sarca_client_linux_arm64
          - name: windows-amd64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
            asset: sarca_client_windows_amd64
          - name: windows-arm64
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            bundles: nsis
            asset: sarca_client_windows_arm64
          - name: macos-arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            bundles: dmg
            asset: sarca_client_macos_arm64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CI: true

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Linux deps (WebKit/GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-client-${{ matrix.name }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build Tauri client
        working-directory: client
        run: |
          set -euo pipefail
          pnpm tauri build \
            --target "${{ matrix.rust_target }}" \
            --bundles "${{ matrix.bundles }}"

      - name: Rename installers for release
        env:
          TARGET: ${{ matrix.rust_target }}
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="target/${TARGET}/release/bundle"
          OUT="dist"
          mkdir -p "${OUT}"
          shopt -s nullglob

          # Only ship installers (no AppImage, no naked Linux/macOS binaries, no checksums).
          for f in "${BUNDLE}/deb/"*.deb; do
            cp -a "$f" "${OUT}/${ASSET}.deb"
          done
          for f in "${BUNDLE}/nsis/"*.exe; do
            cp -a "$f" "${OUT}/${ASSET}-setup.exe"
          done
          for f in "${BUNDLE}/dmg/"*.dmg; do
            cp -a "$f" "${OUT}/${ASSET}.dmg"
          done

          echo "Release files:"
          find "${OUT}" -maxdepth 1 -type f | sort
          test "$(find "${OUT}" -maxdepth 1 -type f | wc -l)" -ge 1

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Android APK (sideload). Optional keystore secrets sign a release APK;
  # without them Tauri still produces an installable APK for testing.
  build-client-android:
    needs: [version]
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CI: true

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Install Android NDK / SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$NDK"
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
            echo "NDK_HOME=$NDK"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          PREBUILT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$PREBUILT" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$PREBUILT/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$PREBUILT/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          clang --version || "$PREBUILT/clang" --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-client-android

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        working-directory: client
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUST_BACKTRACE: "1"
          RUSTFLAGS: "--cfg reqwest_unstable"
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-}"
          test -n "${ANDROID_HOME:-}"
          test -n "${ANDROID_NDK_HOME:-}"
          test -x "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          if [ ! -d src-tauri/gen/android ]; then
            pnpm tauri android init --ci --skip-targets-install
          fi
          bash scripts/patch-android-http.sh src-tauri/gen/android

          # Mobile ACL: drop desktop-only process permission if regenerated.
          python3 -c "import json,pathlib; p=pathlib.Path('src-tauri/capabilities/default.json'); data=json.loads(p.read_text()); data['permissions']=[x for x in data.get('permissions',[]) if not str(x).startswith('process:')]; p.write_text(json.dumps(data,indent=2)+'\n')"

          # A published release APK must be signed with a key nobody else holds.
          # The committed `mobile/sarca-sideload.p12` and its password are public
          # (they are in this repository), so an APK signed with it can be forged
          # by anyone: Android would accept the forgery as an in-place update of
          # the installed Sarca and hand it the app's storage, permissions and
          # data directory. It is a throwaway key for local/CI smoke builds only.
          mkdir -p src-tauri/gen/android
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set." >&2
            echo "Refusing to publish a release APK signed with the public committed keystore." >&2
            echo "Generate a release key and add it to repository secrets:" >&2
            echo "  keytool -genkeypair -v -keystore release.p12 -storetype PKCS12 \\" >&2
            echo "    -alias sarca -keyalg RSA -keysize 4096 -validity 10000" >&2
            echo "  base64 -w0 release.p12   # -> secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          KS_PATH="${GITHUB_WORKSPACE}/client/src-tauri/release.keystore"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${KS_PATH}"
          STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD required}"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          ALIAS="${ANDROID_KEY_ALIAS:-sarca}"
          echo "Using ANDROID_KEYSTORE_* secrets for APK signing."
          {
            echo "storePassword=${STORE_PASS}"
            echo "keyPassword=${KEY_PASS}"
            echo "keyAlias=${ALIAS}"
            echo "storeFile=${KS_PATH}"
          } > src-tauri/gen/android/keystore.properties

          pnpm tauri android build --apk --target aarch64 --ci

      - name: Package APK for release
        env:
          ASSET: sarca_client_android_arm64
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob globstar
          candidates=(
            client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            target/**/*.apk
          )
          apk=""
          for f in "${candidates[@]}"; do
            [[ -f "$f" ]] || continue
            [[ "$f" == *unsigned* ]] && continue
            if [[ "$f" == *release* ]] || [[ -z "$apk" ]]; then
              apk="$f"
            fi
            if [[ "$f" == *release*.apk ]]; then
              apk="$f"
              break
            fi
          done
          # Fall back to unsigned artifact only to sign it ourselves.
          if [[ -z "$apk" ]]; then
            for f in "${candidates[@]}"; do
              [[ -f "$f" ]] || continue
              apk="$f"
              break
            done
          fi
          if [[ -z "$apk" ]]; then
            echo "No APK produced" >&2
            find client/src-tauri/gen/android -name '*.apk' 2>/dev/null | head -50 || true
            find target -name '*.apk' 2>/dev/null | head -50 || true
            exit 1
          fi

          echo "Found APK: ${apk}"
          # Ensure v2/v3 signature (Pixel / modern Android reject unsigned APKs).
          if ! python3 -c "import sys; sys.exit(0 if b'APK Sig Block 42' in open(sys.argv[1],'rb').read() else 1)" "$apk"; then
            echo "APK is unsigned — signing with sideload/release keystore…"
            bash client/scripts/sign-android-apk.sh "$apk" "dist/${ASSET}.apk"
          else
            cp -a "$apk" "dist/${ASSET}.apk"
            # Re-verify with apksigner when available.
            if command -v apksigner >/dev/null; then
              apksigner verify --verbose "dist/${ASSET}.apk"
            elif [[ -x "${ANDROID_HOME:-}/build-tools/34.0.0/apksigner" ]]; then
              "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose "dist/${ASSET}.apk"
            fi
          fi

          python3 -c "import sys; data=open(sys.argv[1],'rb').read(); assert b'APK Sig Block 42' in data, 'missing v2/v3 signature'" "dist/${ASSET}.apk"
          rm -f "dist/${ASSET}.apk.idsig" "dist/${ASSET}.apk.sha256"
          echo "Packed ${ASSET}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: sarca_client_android_arm64
          path: dist/sarca_client_android_arm64.apk
          if-no-files-found: error
          retention-days: 1

  # iOS: signed IPA when Apple secrets are configured; otherwise simulator .app zip.
  # Temporarily disabled — keep the job definition; re-enable by removing `if: false`.
  build-client-ios:
    if: false
    needs: [version]
    runs-on: macos-14
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CI: true

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-client-ios

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing material (optional)
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE_BASE64:-}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Apple certificate secrets — building iOS Simulator artifact only."
            exit 0
          fi
          CERT_PATH="${RUNNER_TEMP}/sarca-ios.p12"
          echo "${APPLE_CERTIFICATE_BASE64}" | base64 -d > "${CERT_PATH}"
          KEYCHAIN="${RUNNER_TEMP}/sarca-ios.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "${CERT_PATH}" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          security list-keychain -d user -s "${KEYCHAIN}" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build iOS
        working-directory: client
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          if [ ! -d src-tauri/gen/apple ]; then
            pnpm tauri ios init --ci
          fi
          if [[ "${SIGNED}" == "true" ]]; then
            pnpm tauri ios build --target aarch64 --ci
          else
            pnpm tauri ios build --target aarch64-sim --ci
          fi

      - name: Package iOS for release
        env:
          ASSET: sarca_client_ios_arm64
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob globstar

          ipas=(client/src-tauri/gen/apple/**/*.ipa target/**/*.ipa)
          if ((${#ipas[@]})) && [[ -f "${ipas[0]}" ]]; then
            cp -a "${ipas[0]}" "dist/${ASSET}.ipa"
            echo "Packed IPA from ${ipas[0]}"
          else
            apps=(client/src-tauri/gen/apple/**/*.app target/**/*.app)
            app=""
            for f in "${apps[@]}"; do
              [[ -d "$f" ]] || continue
              app="$f"
              break
            done
            if [[ -z "$app" ]]; then
              echo "No IPA or .app produced" >&2
              find client/src-tauri/gen/apple -maxdepth 6 \( -name '*.ipa' -o -name '*.app' \) 2>/dev/null | head -50 || true
              exit 1
            fi
            if [[ "${SIGNED}" == "true" ]]; then
              ditto -c -k --sequesterRsrc --keepParent "$app" "dist/${ASSET}-app.zip"
              echo "No .ipa export; packed signed .app zip from ${app}"
            else
              ditto -c -k --sequesterRsrc --keepParent "$app" "dist/${ASSET}-simulator.zip"
              echo "Packed simulator app from ${app}"
            fi
          fi

          cd dist
          for f in *; do
            [ -f "$f" ] || continue
            shasum -a 256 "$f" > "${f}.sha256"
          done
          test "$(find . -maxdepth 1 -type f ! -name '*.sha256' | wc -l)" -ge 1

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: sarca_client_ios_arm64
          path: dist/*
          if-no-files-found: warn
          retention-days: 1

  release:
    # build-client-ios omitted from needs while iOS builds are disabled (`if: false` above).
    # Waits on `package` (not `build`) so release archives include the UI bundle.
    needs: [version, package, build-client, build-client-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: sarca_*
          merge-multiple: true

      - name: Prepare sorted release assets + notes
        id: notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Drop checksums, apksigner sidecars, AppImages, naked Unix binaries, and portable Windows client exes.
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              *.sha256|*.idsig|*.AppImage) continue ;;
              sarca_client_linux_amd64|sarca_client_linux_arm64|sarca_client_macos_arm64) continue ;;
              # Drop portable Windows client exes; keep *-setup.exe installers only.
              sarca_client_windows_*.exe)
                case "$base" in
                  *-setup.exe) ;;
                  *) continue ;;
                esac
                ;;
            esac
            cp -a "$f" "release-assets/${base}"
          done < <(find artifacts -type f -print0)

          # Alphabetical order for upload / listing.
          mapfile -t FILES < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#FILES[@]}" -ge 1
          printf '%s\n' "${FILES[@]}"

          server=0
          clients=0
          for f in "${FILES[@]}"; do
            case "$f" in
              sarca_linux_*.tar.gz|sarca_windows_*.zip|sarca_macos_*.tar.gz) server=$((server + 1)) ;;
              sarca_client_*) clients=$((clients + 1)) ;;
            esac
          done
          echo "server_archives=${server}"
          echo "client_files=${clients}"
          test "${server}" -ge 4
          test -f release-assets/sarca_client_android_arm64.apk
          test -f release-assets/sarca_client_linux_amd64.deb
          test -f release-assets/sarca_client_linux_arm64.deb
          test -f release-assets/sarca_client_macos_arm64.dmg
          test -f release-assets/sarca_client_windows_amd64-setup.exe
          test -f release-assets/sarca_client_windows_arm64-setup.exe

          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          label_for() {
            case "$1" in
              sarca_linux_amd64.tar.gz) echo "Server — Linux x86_64" ;;
              sarca_linux_arm64.tar.gz) echo "Server — Linux aarch64" ;;
              sarca_macos_arm64.tar.gz) echo "Server — macOS Apple Silicon" ;;
              sarca_windows_amd64.zip) echo "Server — Windows x86_64" ;;
              sarca_client_android_arm64.apk) echo "Client — Android arm64 (sideload APK)" ;;
              sarca_client_linux_amd64.deb) echo "Client — Linux x86_64 (.deb)" ;;
              sarca_client_linux_arm64.deb) echo "Client — Linux aarch64 (.deb)" ;;
              sarca_client_macos_arm64.dmg) echo "Client — macOS Apple Silicon (.dmg)" ;;
              sarca_client_windows_amd64-setup.exe) echo "Client — Windows x86_64 (installer)" ;;
              sarca_client_windows_arm64-setup.exe) echo "Client — Windows ARM64 (installer)" ;;
              *) echo "$1" ;;
            esac
          }

          {
            echo "Multi-platform binaries for \`${TAG}\`."
            echo
            echo "### Downloads"
            echo
            echo "| File | Description |"
            echo "| --- | --- |"
            for f in "${FILES[@]}"; do
              echo "| [\`${f}\`](${BASE}/${f}) | $(label_for "$f") |"
            done
            echo
            echo "**Android:** allow unknown sources / sideload the APK. Signed with the repo sideload keystore (or \`ANDROID_KEYSTORE_*\` secrets)."
            echo
            echo "**Install server (Linux / macOS)**"
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/refs/heads/master/install.sh | bash"
            echo '```'
            echo
            echo "**Install server (Windows PowerShell)**"
            echo '```powershell'
            echo "irm https://raw.githubusercontent.com/${REPO}/refs/heads/master/install.ps1 | iex"
            echo '```'
            echo
            echo "**Docker**"
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/refs/heads/master/install.sh | bash -s -- --docker"
            echo "cd sarca && docker compose --env-file sarca.conf up -d"
            echo '```'
            echo
            echo "Image: \`ghcr.io/${REPO}:${TAG}\` (also \`:latest\`)."
            echo "Postgres is required — see README."
          } > release-body.md

          # Explicit sorted file list for softprops (stable order).
          : > release-files.txt
          for f in "${FILES[@]}"; do
            echo "release-assets/${f}" >> release-files.txt
          done

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: release-body.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GITHUB_TOKEN cannot trigger other workflows on release:published — call Docker directly.
  # The image build curls sarca_linux_${arch}.tar.gz from the release, so it has to wait
  # for `release` to publish it; starting earlier just races the upload and 404s.
  docker:
    needs: [version, package, release]
    uses: ./.github/workflows/docker-image.yml
    with:
      version: ${{ needs.version.outputs.tag }}
    secrets: inherit
