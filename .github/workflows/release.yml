name: Release binaries

# Auto-release on every push to master (patch bump), or manually with a bump type.
# Manual tags (v*) still work. Version in Cargo.toml / package.json is updated by CI.
on:
  push:
    branches: ["master"]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump when releasing from a branch"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

jobs:
  # Skip auto-release for the bot commit that only bumps version files.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          set -uo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log -1 --pretty=%s | grep -qE '^chore: release v'; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping version-bump commit"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [guard]
    if: needs.guard.outputs.proceed == 'true'
    uses: ./.github/workflows/e2e.yml

  version:
    needs: [guard, e2e]
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve next version
        id: meta
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: |
          set -uo pipefail

          # Tag push: use the tag as-is, do not bump or commit.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Using existing tag ${TAG}"
            exit 0
          fi

          LATEST="$(git tag -l 'v*' --sort=-v:refname | head -1 || true)"
          if [[ -z "${LATEST}" ]]; then
            MAJOR=0; MINOR=0; PATCH=0
          else
            RAW="${LATEST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<<"${RAW}"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          fi

          case "${BUMP}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Unknown bump: ${BUMP}" >&2; exit 1 ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi

          # Keep package manifests in sync with the release tag.
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" sarca/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" client/src-tauri/Cargo.toml
          python3 - <<PY
          import json, pathlib, re
          for path in [
              pathlib.Path("ui/package.json"),
              pathlib.Path("client/package.json"),
          ]:
              data = json.loads(path.read_text())
              data["version"] = "${VERSION}"
              path.write_text(json.dumps(data, indent=2) + "\n")
          conf = pathlib.Path("client/src-tauri/tauri.conf.json")
          text = conf.read_text()
          text = re.sub(r'"version"\s*:\s*"[^"]*"', '"version": "${VERSION}"', text, count=1)
          conf.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sarca/Cargo.toml ui/package.json client/package.json client/src-tauri/Cargo.toml client/src-tauri/tauri.conf.json
          git commit -m "chore: release ${TAG}"
          git tag "${TAG}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "${TAG}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Prepared ${TAG} (bump=${BUMP}, previous=${LATEST:-none})"

  build-ui:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build UI
        working-directory: ui
        env:
          VITE_API_BASE: /api
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/upload-artifact@v6
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  build:
    needs: [version, build-ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin Linux to 22.04 so release binaries need GLIBC ≤ 2.35 and run on
          # Bookworm/older hosts; ubuntu-latest (24.04) would require GLIBC 2.39.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            asset: sarca_linux_amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            asset: sarca_linux_arm64
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            asset: sarca_windows_amd64
            binary: sarca.exe
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            asset: sarca_macos_arm64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v7
        with:
          name: ui-dist
          path: package/ui

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux aarch64 cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p sarca --target ${{ matrix.target }}

      - name: Package artifact
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          ARCHIVE: ${{ matrix.archive }}
          BINARY_NAME: ${{ matrix.binary || 'sarca' }}
        run: |
          set -uo pipefail
          mkdir -p "dist/${ASSET}"
          cp "target/${TARGET}/release/${BINARY_NAME}" "dist/${ASSET}/"
          cp -r package/ui "dist/${ASSET}/ui"
          cd dist
          if [ "${ARCHIVE}" = "zip" ]; then
            if command -v zip >/dev/null; then
              zip -r "${ASSET}.zip" "${ASSET}"
            else
              powershell.exe -NoProfile -Command "Compress-Archive -Path '${ASSET}' -DestinationPath '${ASSET}.zip'"
            fi
            ARTIFACT="${ASSET}.zip"
          else
            tar -czf "${ASSET}.tar.gz" "${ASSET}"
            ARTIFACT="${ASSET}.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "${ARTIFACT}" > "${ARTIFACT}.sha256"
          else
            shasum -a 256 "${ARTIFACT}" > "${ARTIFACT}.sha256"
          fi
          echo "Packed ${ARTIFACT}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.${{ matrix.archive }}
            dist/${{ matrix.asset }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 1

  # Native sync clients (Tauri) — parallel with server binaries.
  build-client:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            asset: sarca_client_linux_amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            asset: sarca_client_linux_arm64
          - name: windows-amd64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
            asset: sarca_client_windows_amd64
          - name: windows-arm64
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            bundles: nsis
            asset: sarca_client_windows_arm64
          - name: macos-arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
            asset: sarca_client_macos_arm64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CI: true

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Linux deps (WebKit/GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-client-${{ matrix.name }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build Tauri client
        working-directory: client
        run: |
          set -euo pipefail
          pnpm tauri build \
            --target "${{ matrix.rust_target }}" \
            --bundles "${{ matrix.bundles }}"

      - name: Rename installers for release
        env:
          TARGET: ${{ matrix.rust_target }}
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="target/${TARGET}/release/bundle"
          OUT="dist"
          mkdir -p "${OUT}"

          # Publish flat installer/binary files with stable names (no tar.gz wrappers).
          shopt -s nullglob

          for f in "${BUNDLE}/deb/"*.deb; do
            cp -a "$f" "${OUT}/${ASSET}.deb"
          done
          for f in "${BUNDLE}/appimage/"*.AppImage; do
            cp -a "$f" "${OUT}/${ASSET}.AppImage"
            chmod +x "${OUT}/${ASSET}.AppImage"
          done
          for f in "${BUNDLE}/nsis/"*.exe; do
            cp -a "$f" "${OUT}/${ASSET}-setup.exe"
          done
          for f in "${BUNDLE}/dmg/"*.dmg; do
            cp -a "$f" "${OUT}/${ASSET}.dmg"
          done

          if [ -f "target/${TARGET}/release/sarca-client" ]; then
            cp "target/${TARGET}/release/sarca-client" "${OUT}/${ASSET}"
            chmod +x "${OUT}/${ASSET}"
          fi
          if [ -f "target/${TARGET}/release/sarca-client.exe" ]; then
            cp "target/${TARGET}/release/sarca-client.exe" "${OUT}/${ASSET}.exe"
          fi

          echo "Release files:"
          find "${OUT}" -maxdepth 1 -type f | sort
          test "$(find "${OUT}" -maxdepth 1 -type f | wc -l)" -ge 1

          cd "${OUT}"
          for f in *; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "${f}.sha256"
            else
              shasum -a 256 "$f" > "${f}.sha256"
            fi
          done

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Android APK (sideload). Optional keystore secrets sign a release APK;
  # without them Tauri still produces an installable APK for testing.
  build-client-android:
    needs: [version]
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CI: true

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK / SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$NDK"
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "NDK_HOME=$NDK"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          PREBUILT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$PREBUILT" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$PREBUILT/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$PREBUILT/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          clang --version || "$PREBUILT/clang" --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-client-android

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        working-directory: client
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          test -n "${ANDROID_HOME:-}"
          test -n "${ANDROID_NDK_HOME:-}"
          test -x "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          if [ ! -d src-tauri/gen/android ]; then
            pnpm tauri android init --ci --skip-targets-install
          fi
          bash scripts/patch-android-http.sh src-tauri/gen/android

          # Mobile ACL: drop desktop-only process permission if regenerated.
          python3 -c "import json,pathlib; p=pathlib.Path('src-tauri/capabilities/default.json'); data=json.loads(p.read_text()); data['permissions']=[x for x in data.get('permissions',[]) if not str(x).startswith('process:')]; p.write_text(json.dumps(data,indent=2)+'\n')"

          # Always configure Gradle signing: secrets if present, else committed sideload keystore.
          mkdir -p src-tauri/gen/android
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            KS_PATH="${GITHUB_WORKSPACE}/client/src-tauri/release.keystore"
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${KS_PATH}"
            STORE_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            ALIAS="${ANDROID_KEY_ALIAS:-sarca}"
            echo "Using ANDROID_KEYSTORE_* secrets for APK signing."
          else
            KS_PATH="${GITHUB_WORKSPACE}/client/mobile/sarca-sideload.p12"
            STORE_PASS="sarca-sideload"
            KEY_PASS="sarca-sideload"
            ALIAS="sarca"
            echo "Using committed sideload keystore for APK signing."
          fi
          {
            echo "storePassword=${STORE_PASS}"
            echo "keyPassword=${KEY_PASS}"
            echo "keyAlias=${ALIAS}"
            echo "storeFile=${KS_PATH}"
          } > src-tauri/gen/android/keystore.properties

          pnpm tauri android build --apk --target aarch64 --ci

      - name: Package APK for release
        env:
          ASSET: sarca_client_android_arm64
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob globstar
          candidates=(
            client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            target/**/*.apk
          )
          apk=""
          for f in "${candidates[@]}"; do
            [[ -f "$f" ]] || continue
            [[ "$f" == *unsigned* ]] && continue
            if [[ "$f" == *release* ]] || [[ -z "$apk" ]]; then
              apk="$f"
            fi
            if [[ "$f" == *release*.apk ]]; then
              apk="$f"
              break
            fi
          done
          # Fall back to unsigned artifact only to sign it ourselves.
          if [[ -z "$apk" ]]; then
            for f in "${candidates[@]}"; do
              [[ -f "$f" ]] || continue
              apk="$f"
              break
            done
          fi
          if [[ -z "$apk" ]]; then
            echo "No APK produced" >&2
            find client/src-tauri/gen/android -name '*.apk' 2>/dev/null | head -50 || true
            find target -name '*.apk' 2>/dev/null | head -50 || true
            exit 1
          fi

          echo "Found APK: ${apk}"
          # Ensure v2/v3 signature (Pixel / modern Android reject unsigned APKs).
          if ! python3 -c "import sys; sys.exit(0 if b'APK Sig Block 42' in open(sys.argv[1],'rb').read() else 1)" "$apk"; then
            echo "APK is unsigned — signing with sideload/release keystore…"
            bash client/scripts/sign-android-apk.sh "$apk" "dist/${ASSET}.apk"
          else
            cp -a "$apk" "dist/${ASSET}.apk"
            # Re-verify with apksigner when available.
            if command -v apksigner >/dev/null; then
              apksigner verify --verbose "dist/${ASSET}.apk"
            elif [[ -x "${ANDROID_HOME:-}/build-tools/34.0.0/apksigner" ]]; then
              "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose "dist/${ASSET}.apk"
            fi
          fi

          python3 -c "import sys; data=open(sys.argv[1],'rb').read(); assert b'APK Sig Block 42' in data, 'missing v2/v3 signature'" "dist/${ASSET}.apk"
          echo "Packed ${ASSET}.apk"
          cd dist
          sha256sum "${ASSET}.apk" > "${ASSET}.apk.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: sarca_client_android_arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # iOS: signed IPA when Apple secrets are configured; otherwise simulator .app zip.
  # Temporarily disabled — keep the job definition; re-enable by removing `if: false`.
  build-client-ios:
    if: false
    needs: [version]
    runs-on: macos-14
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CI: true

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-client-ios

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing material (optional)
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE_BASE64:-}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Apple certificate secrets — building iOS Simulator artifact only."
            exit 0
          fi
          CERT_PATH="${RUNNER_TEMP}/sarca-ios.p12"
          echo "${APPLE_CERTIFICATE_BASE64}" | base64 -d > "${CERT_PATH}"
          KEYCHAIN="${RUNNER_TEMP}/sarca-ios.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "${CERT_PATH}" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          security list-keychain -d user -s "${KEYCHAIN}" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build iOS
        working-directory: client
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          if [ ! -d src-tauri/gen/apple ]; then
            pnpm tauri ios init --ci
          fi
          if [[ "${SIGNED}" == "true" ]]; then
            pnpm tauri ios build --target aarch64 --ci
          else
            pnpm tauri ios build --target aarch64-sim --ci
          fi

      - name: Package iOS for release
        env:
          ASSET: sarca_client_ios_arm64
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob globstar

          ipas=(client/src-tauri/gen/apple/**/*.ipa target/**/*.ipa)
          if ((${#ipas[@]})) && [[ -f "${ipas[0]}" ]]; then
            cp -a "${ipas[0]}" "dist/${ASSET}.ipa"
            echo "Packed IPA from ${ipas[0]}"
          else
            apps=(client/src-tauri/gen/apple/**/*.app target/**/*.app)
            app=""
            for f in "${apps[@]}"; do
              [[ -d "$f" ]] || continue
              app="$f"
              break
            done
            if [[ -z "$app" ]]; then
              echo "No IPA or .app produced" >&2
              find client/src-tauri/gen/apple -maxdepth 6 \( -name '*.ipa' -o -name '*.app' \) 2>/dev/null | head -50 || true
              exit 1
            fi
            if [[ "${SIGNED}" == "true" ]]; then
              ditto -c -k --sequesterRsrc --keepParent "$app" "dist/${ASSET}-app.zip"
              echo "No .ipa export; packed signed .app zip from ${app}"
            else
              ditto -c -k --sequesterRsrc --keepParent "$app" "dist/${ASSET}-simulator.zip"
              echo "Packed simulator app from ${app}"
            fi
          fi

          cd dist
          for f in *; do
            [ -f "$f" ] || continue
            shasum -a 256 "$f" > "${f}.sha256"
          done
          test "$(find . -maxdepth 1 -type f ! -name '*.sha256' | wc -l)" -ge 1

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: sarca_client_ios_arm64
          path: dist/*
          if-no-files-found: warn
          retention-days: 1

  release:
    # build-client-ios omitted from needs while iOS builds are disabled (`if: false` above).
    needs: [version, build, build-client, build-client-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: sarca_*
          merge-multiple: true

      - name: Assert release files present
        run: |
          set -uo pipefail
          find artifacts -type f | sort
          server="$(find artifacts -type f \( -name 'sarca_linux_*.tar.gz' -o -name 'sarca_windows_*.zip' -o -name 'sarca_macos_*.tar.gz' \) ! -name 'sarca_client_*' | wc -l)"
          clients=0
          for p in linux_amd64 linux_arm64 windows_amd64 windows_arm64 macos_arm64; do
            if find artifacts -type f -name "sarca_client_${p}*" ! -name '*.sha256' | grep -q .; then
              clients=$((clients + 1))
            else
              echo "missing client files for ${p}" >&2
            fi
          done
          echo "server_archives=${server}"
          echo "client_platforms=${clients}"
          test "${server}" -ge 4
          test "${clients}" -ge 5
          test -f artifacts/sarca_client_android_arm64.apk
          if ! find artifacts -type f \( -name 'sarca_client_ios_arm64.ipa' -o -name 'sarca_client_ios_arm64-simulator.zip' -o -name 'sarca_client_ios_arm64-app.zip' \) | grep -q .; then
            echo "warning: no iOS client artifact (build may have failed without Apple secrets)" >&2
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Multi-platform binaries for `${{ needs.version.outputs.tag }}`.

            ### Server (`sarca` + `ui/` inside archive)
            | Asset | Platform |
            | --- | --- |
            | `sarca_linux_amd64.tar.gz` | Linux x86_64 |
            | `sarca_linux_arm64.tar.gz` | Linux aarch64 |
            | `sarca_windows_amd64.zip` | Windows x86_64 |
            | `sarca_macos_arm64.tar.gz` | macOS Apple Silicon |

            ### Sync client (installers / binaries)
            | Asset | Platform |
            | --- | --- |
            | `sarca_client_linux_amd64.AppImage` / `.deb` | Linux x86_64 |
            | `sarca_client_linux_arm64.AppImage` / `.deb` | Linux aarch64 |
            | `sarca_client_windows_amd64-setup.exe` | Windows x86_64 |
            | `sarca_client_windows_arm64-setup.exe` | Windows ARM64 |
            | `sarca_client_macos_arm64.dmg` | macOS Apple Silicon |
            | `sarca_client_android_arm64.apk` | Android arm64 (sideload) |
            | `sarca_client_ios_arm64.ipa` | iOS device (when Apple signing secrets are set) |
            | `sarca_client_ios_arm64-simulator.zip` | iOS Simulator fallback |

            Portable binaries are also attached where available (`sarca_client_linux_*`, `sarca_client_windows_*.exe`).

            **Android:** install the signed APK (allow unknown sources). The release APK is signed with the repo sideload keystore (or `ANDROID_KEYSTORE_*` secrets). Unsigned APKs will not install on modern Android (e.g. Pixel).
            **iOS device IPA:** requires `APPLE_CERTIFICATE_BASE64` + `APPLE_CERTIFICATE_PASSWORD` (and provisioning / API key as needed). Without them CI attaches a Simulator build only.

            **Install server (Linux / macOS)**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/insigmo/sarca/refs/heads/master/install.sh | bash
            ```

            **Install server (Windows PowerShell)**
            ```powershell
            irm https://raw.githubusercontent.com/insigmo/sarca/refs/heads/master/install.ps1 | iex
            ```

            **Docker**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/insigmo/sarca/refs/heads/master/install.sh | bash -s -- --docker
            cd sarca && docker compose --env-file sarca.conf up -d
            ```

            Image: `ghcr.io/insigmo/sarca:${{ needs.version.outputs.tag }}` (also `:latest`).
            Postgres is required — see README.
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GITHUB_TOKEN cannot trigger other workflows on release:published — call Docker directly.
  docker:
    needs: [version, release]
    uses: ./.github/workflows/docker-image.yml
    with:
      version: ${{ needs.version.outputs.tag }}
    secrets: inherit
