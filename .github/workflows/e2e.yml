name: E2E API tests

on:
  # Release workflow runs e2e on master; keep this for PRs and reusable calls.
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # rustfmt + clippy + unit/integration tests. Independent of build-server's
  # release-profile compile, so it runs on its own runner in parallel.
  checks:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: e2e-checks

      - name: rustfmt (strict / nightly)
        run: cargo +nightly fmt -p sarca -- --check

      - name: clippy (deny pedantic/nursery/cargo)
        # Pin stable: installing nightly above would otherwise make bare `cargo` use nightly
        # (often without the clippy component) and fail immediately.
        run: cargo +stable clippy -p sarca --all-targets --all-features -- -D warnings

      - name: Unit + integration tests
        run: cargo +stable test -p sarca

  # No Rust involved — runs in parallel with checks/build-server.
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build UI
        working-directory: ui
        env:
          VITE_API_BASE: /api
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/upload-artifact@v6
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  # Release-profile compile — separate cargo profile from checks' debug
  # build, so it doesn't need to wait behind clippy/test compilation.
  build-server:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: e2e-build-server

      - name: Build server
        run: cargo +stable build --release -p sarca

      - uses: actions/upload-artifact@v6
        with:
          name: server-bin
          path: target/release/sarca
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: [checks, build-ui, build-server]
    runs-on: ubuntu-latest

    env:
      PORT: "8000"
      WORKERS: "2"
      CHANNEL_CAPACITY: "8"
      SUPERUSER_EMAIL: e2e@sarca.test
      SUPERUSER_PASS: e2e-password
      ACCESS_TOKEN_EXPIRE_IN_SECS: "1800"
      REFRESH_TOKEN_EXPIRE_IN_DAYS: "14"
      SECRET_KEY: e2e-secret-key-for-ci-only-not-production
      TELEGRAM_API_BASE_URL: https://api.telegram.org
      TELEGRAM_RATE_LIMIT: "18"
      TELEGRAM_CHUNK_SIZE_MB: "20"
      TELEGRAM_VIDEO_CHUNK_SIZE_MB: "20"
      WORK_DIR: ${{ github.workspace }}/work
      SQLITE_PATH: ${{ github.workspace }}/runtime/sarca.sqlite
      SARCA_PLAIN_HTTP: "1"
      SARCA_BASE_URL: http://127.0.0.1:8000
      # e2e/helpers/server.py's build_binary() reruns `cargo build --release` unless
      # this is set — this job has no Rust toolchain/cache, and the binary is already
      # built by the build-server job (downloaded below to target/release/sarca).
      SARCA_SKIP_BUILD: "1"

    steps:
      - uses: actions/checkout@v5

      # e2e/helpers/server.py's ui_dist() looks for <repo_root>/ui/dist/index.html
      # (used to symlink UI for managed server instances spawned directly by tests,
      # e.g. test_04_http3.py / test_06_settings.py) — download straight into place.
      - uses: actions/download-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

      # build_binary() defaults to <CARGO_TARGET_DIR or repo_root/target>/release/sarca.
      - uses: actions/download-artifact@v7
        with:
          name: server-bin
          path: target/release

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Prepare runtime dir
        run: |
          mkdir -p "$WORK_DIR" runtime/ui
          cp -a ui/dist/. runtime/ui/
          chmod +x target/release/sarca
          cp target/release/sarca runtime/sarca
          chmod +x runtime/sarca
          # Binary self-loads sarca.conf (production-like).
          {
            echo "PORT=${PORT}"
            echo "WORKERS=${WORKERS}"
            echo "CHANNEL_CAPACITY=${CHANNEL_CAPACITY}"
            echo "SUPERUSER_EMAIL=${SUPERUSER_EMAIL}"
            echo "SUPERUSER_PASS=${SUPERUSER_PASS}"
            echo "ACCESS_TOKEN_EXPIRE_IN_SECS=${ACCESS_TOKEN_EXPIRE_IN_SECS}"
            echo "REFRESH_TOKEN_EXPIRE_IN_DAYS=${REFRESH_TOKEN_EXPIRE_IN_DAYS}"
            echo "SECRET_KEY=${SECRET_KEY}"
            echo "TELEGRAM_API_BASE_URL=${TELEGRAM_API_BASE_URL}"
            echo "TELEGRAM_RATE_LIMIT=${TELEGRAM_RATE_LIMIT}"
            echo "TELEGRAM_CHUNK_SIZE_MB=${TELEGRAM_CHUNK_SIZE_MB}"
            echo "TELEGRAM_VIDEO_CHUNK_SIZE_MB=${TELEGRAM_VIDEO_CHUNK_SIZE_MB}"
            echo "WORK_DIR=${WORK_DIR}"
            echo "SQLITE_PATH=${SQLITE_PATH}"
            echo "SARCA_PLAIN_HTTP=${SARCA_PLAIN_HTTP}"
          } > runtime/sarca.conf

      - name: Start server
        working-directory: runtime
        run: |
          env -i HOME="$HOME" PATH="$PATH" \
            ./sarca >"$GITHUB_WORKSPACE/server.log" 2>&1 &
          echo $! >"$GITHUB_WORKSPACE/server.pid"
          for i in $(seq 1 45); do
            if grep -q "Sarca is running" "$GITHUB_WORKSPACE/server.log" 2>/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$GITHUB_WORKSPACE/server.pid")" 2>/dev/null; then
              echo "server exited early:"; cat "$GITHUB_WORKSPACE/server.log"; exit 1
            fi
            sleep 1
          done
          echo "server did not become ready:"; cat "$GITHUB_WORKSPACE/server.log"; exit 1

      - name: Install e2e deps
        run: pip install -r e2e/requirements.txt

      - name: Run e2e tests
        env:
          SARCA_SERVER_LOG: ${{ github.workspace }}/server.log
        # Exclude @pytest.mark.smoke (needs a live Telegram storage worker).
        run: pytest -q e2e/ -m "not smoke"

      - name: Dump server log on failure
        if: failure()
        run: cat "$GITHUB_WORKSPACE/server.log" || true

      - name: Stop server
        if: always()
        run: kill "$(cat "$GITHUB_WORKSPACE/server.pid")" 2>/dev/null || true
