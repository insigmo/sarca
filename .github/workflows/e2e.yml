name: E2E API tests

on:
  # Release workflow runs e2e on master; keep this for PRs and reusable calls.
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # rustfmt + clippy + unit/integration tests. Independent of build-server's
  # release-profile compile, so it runs on its own runner in parallel.
  checks:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: e2e-checks

      - name: rustfmt (strict / nightly)
        run: cargo +nightly fmt -p sarca -- --check

      - name: clippy (deny pedantic/nursery/cargo)
        # Pin stable: installing nightly above would otherwise make bare `cargo` use nightly
        # (often without the clippy component) and fail immediately.
        run: cargo +stable clippy -p sarca --all-targets --all-features -- -D warnings

      - name: Unit + integration tests
        run: cargo +stable test -p sarca

  # No Rust involved — runs in parallel with checks/build-server.
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build UI
        working-directory: ui
        env:
          VITE_API_BASE: /api
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/upload-artifact@v6
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  # Release-profile compile — separate cargo profile from checks' debug
  # build, so it doesn't need to wait behind clippy/test compilation.
  build-server:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: e2e-build-server

      - name: Build server
        run: cargo +stable build --release -p sarca

      # test_03/test_09 drive the real sync engine through this example, so the
      # e2e job (which has no toolchain) gets it prebuilt as well.
      - name: Build headless sync driver
        run: cargo +stable build -p sarca-sync --example headless

      - uses: actions/upload-artifact@v6
        with:
          name: server-bin
          path: target/release/sarca
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v6
        with:
          name: sync-headless
          path: target/debug/examples/headless
          if-no-files-found: error
          retention-days: 1

  # The hermetic harness: conftest.py starts its own `sarca` process against a
  # fake Telegram Bot API, exactly like `task e2e` does locally. Only the GUI
  # suite is excluded — the smoke suite runs on the mock too.
  e2e:
    needs: [checks, build-ui, build-server]
    runs-on: ubuntu-latest

    env:
      # helpers/server.py and helpers/sync_client.py rebuild with cargo unless
      # this is set; this job has no toolchain and both binaries are downloaded.
      SARCA_SKIP_BUILD: "1"

    steps:
      - uses: actions/checkout@v5

      # helpers/server.py's ui_dist() looks for <repo_root>/ui/dist/index.html
      # and symlinks it into every managed server instance.
      - uses: actions/download-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

      # build_binary() defaults to <CARGO_TARGET_DIR or repo_root/target>/release/sarca.
      - uses: actions/download-artifact@v7
        with:
          name: server-bin
          path: target/release

      - uses: actions/download-artifact@v7
        with:
          name: sync-headless
          path: target/debug/examples

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Install e2e deps
        run: |
          chmod +x target/release/sarca target/debug/examples/headless
          pip install -r e2e/requirements.txt

      # -m "not gui": the GUI suite has its own job below. It used to be
      # deselected by this runner having no DISPLAY, which is not something
      # the split should depend on.
      - name: Run e2e tests
        working-directory: e2e
        run: python -m pytest -q -m "not gui"

  # Drives the real desktop client through tauri-pilot. Kept apart from the API
  # suite: it needs GTK/WebKit, a display, and its own debug client build.
  e2e-gui:
    needs: [checks, build-ui, build-server]
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
      SARCA_SKIP_BUILD: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

      - name: Install GTK/WebKit and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev xvfb dbus-x11

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: e2e-gui

      # These two land inside `target/`, so they must be downloaded *after*
      # rust-cache restores it. On a cache hit the restore overwrites the
      # directory and the prebuilt binaries vanish, which is why the next step
      # intermittently failed with "chmod: cannot access 'target/release/sarca'"
      # -- only on runs that hit the cache, so it looked flaky rather than
      # ordered wrong.
      - uses: actions/download-artifact@v7
        with:
          name: server-bin
          path: target/release

      - uses: actions/download-artifact@v7
        with:
          name: sync-headless
          path: target/debug/examples

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Install tauri-pilot CLI
        run: cargo install tauri-pilot-cli --locked

      # The client's own webview bundle; the tests serve it at the debug build's
      # devUrl so the connect screen works without `pnpm dev`.
      - name: Build client webview UI
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # The pilot plugin is compiled in only for debug builds with this feature.
      - name: Build client (debug, pilot)
        run: cargo build -p sarca-client --features pilot

      - name: Install e2e deps
        run: |
          chmod +x target/release/sarca target/debug/examples/headless
          pip install -r e2e/requirements.txt

      - name: Run GUI e2e tests
        working-directory: e2e
        run: xvfb-run -a -s "-screen 0 1280x900x24" python -m pytest -q -m gui

      - name: Client log on failure
        if: failure()
        run: find /tmp -name 'client.log' -newermt '-30 minutes' -exec tail -n 200 {} + || true
