name: Client artifacts

# Parallel desktop (+ optional mobile) builds for all supported platforms.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "client/**"
      - "crates/sarca-sync/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/client.yml"
  push:
    branches: ["master", "feature/sync-clients"]
    paths:
      - "client/**"
      - "crates/sarca-sync/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/client.yml"

# Least privilege: these jobs build and test, they never write to the repo.
# Artifacts are uploaded through actions/upload-artifact, which does not need
# `contents: write`.
permissions:
  contents: read

concurrency:
  group: client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  sync-crate:
    name: sarca-sync tests
    runs-on: ubuntu-latest
    steps:
      - uses: mozilla-actions/sccache-action@v0.0.5
        env:
          RUSTC_WRAPPER: sccache

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: "true"
          shared-key: sync-crate
      - run: cargo test -p sarca-sync
      - name: Check remote Settings ACL (fast)
        run: python3 client/scripts/check-remote-acl.py
      - name: Install Linux WebKit/GTK for client tests
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev
      - name: sarca-client ACL / IPC unit tests
        run: cargo test -p sarca-client --lib

  desktop:
    name: ${{ matrix.name }}
    needs: sync-crate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb
          - name: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb
          - name: windows-amd64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            # MSI needs WiX; NSIS is enough for CI artifacts.
            bundles: nsis
          - name: windows-arm64
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-amd64
            os: macos-14
            rust_target: x86_64-apple-darwin
            bundles: dmg

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (WebKit/GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: client-${{ matrix.name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build Tauri client
        working-directory: client
        shell: bash
        env:
          # Unsigned macOS CI builds (signingIdentity "-" in tauri.conf.json).
          CI: true
        run: |
          set -euo pipefail
          pnpm tauri build \
            --target "${{ matrix.rust_target }}" \
            --bundles "${{ matrix.bundles }}"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: sarca-client-${{ matrix.name }}
          path: |
            target/${{ matrix.rust_target }}/release/bundle/**
            target/${{ matrix.rust_target }}/release/sarca-client
            target/${{ matrix.rust_target }}/release/sarca-client.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: android-arm64
    needs: sync-crate
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Install Android NDK / SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$NDK"
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
            echo "NDK_HOME=$NDK"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          PREBUILT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$PREBUILT" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$PREBUILT/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$PREBUILT/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: client-android

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Init + build Android
        working-directory: client
        env:
          CI: true
          RUST_BACKTRACE: "1"
          # Prefer appending; target rustflags in .cargo/config.toml also set this.
          RUSTFLAGS: "--cfg reqwest_unstable"
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-}"
          test -x "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          if [ ! -d src-tauri/gen/android ]; then
            pnpm tauri android init --ci --skip-targets-install
          fi
          bash scripts/patch-android-http.sh src-tauri/gen/android
          python3 -c "import json,pathlib; p=pathlib.Path('src-tauri/capabilities/default.json'); data=json.loads(p.read_text()); data['permissions']=[x for x in data.get('permissions',[]) if not str(x).startswith('process:')]; p.write_text(json.dumps(data,indent=2)+'\n')"
          mkdir -p src-tauri/gen/android
          # Throwaway public keystore: this is a per-push build artifact that is
          # never published as a release. `release.yml` requires the private
          # ANDROID_KEYSTORE_* secrets instead.
          KS_PATH="${GITHUB_WORKSPACE}/client/mobile/sarca-sideload.p12"
          {
            echo "storePassword=sarca-sideload"
            echo "keyPassword=sarca-sideload"
            echo "keyAlias=sarca"
            echo "storeFile=${KS_PATH}"
          } > src-tauri/gen/android/keystore.properties
          pnpm tauri android build --apk --target aarch64 --ci

      - name: Package APK
        if: success()
        env:
          # CI smoke artifact only, never a release download — see the warning in
          # scripts/sign-android-apk.sh.
          SARCA_ALLOW_PUBLIC_KEYSTORE: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob globstar
          apk=""
          for f in client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk target/**/*.apk; do
            [[ -f "$f" ]] || continue
            [[ "$f" == *unsigned* ]] && continue
            apk="$f"
            [[ "$f" == *release*.apk ]] && break
          done
          if [[ -z "$apk" ]]; then
            for f in client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk target/**/*.apk; do
              [[ -f "$f" ]] || continue
              apk="$f"
              break
            done
          fi
          test -n "$apk"
          if ! python3 -c "import sys; sys.exit(0 if b'APK Sig Block 42' in open(sys.argv[1],'rb').read() else 1)" "$apk"; then
            bash client/scripts/sign-android-apk.sh "$apk" dist/sarca_client_android_arm64.apk
          else
            cp -a "$apk" dist/sarca_client_android_arm64.apk
          fi
          python3 -c "import sys; assert b'APK Sig Block 42' in open(sys.argv[1],'rb').read()" dist/sarca_client_android_arm64.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sarca-client-android-arm64
          path: dist/sarca_client_android_arm64.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: ios-arm64
    needs: sync-crate
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: client-ios

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Init + build iOS (simulator)
        working-directory: client
        env:
          CI: true
        run: |
          set -euo pipefail
          if [ ! -d src-tauri/gen/apple ]; then
            pnpm tauri ios init --ci
          fi
          # Simulator build — no Apple signing secrets required.
          pnpm tauri ios build --target aarch64-sim --ci

      - name: Package iOS artifact
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob globstar
          ipas=(client/src-tauri/gen/apple/**/*.ipa target/**/*.ipa)
          if ((${#ipas[@]})) && [[ -f "${ipas[0]}" ]]; then
            cp -a "${ipas[0]}" dist/sarca_client_ios_arm64.ipa
          else
            app=""
            for f in client/src-tauri/gen/apple/**/*.app target/**/*.app; do
              [[ -d "$f" ]] || continue
              app="$f"
              break
            done
            test -n "$app"
            ditto -c -k --sequesterRsrc --keepParent "$app" dist/sarca_client_ios_arm64-simulator.zip
          fi

      - name: Upload iOS artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sarca-client-ios-arm64
          path: dist/sarca_client_ios_arm64*
          if-no-files-found: warn
          retention-days: 14
