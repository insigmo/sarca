[package]
name = "sarca-sync"
version = "0.1.0"
edition = "2021"
description = "Sarca client sync engine (folder sync + auto-upload)"
license = "MIT"
repository = "https://github.com/insigmo/sarca"
readme = "../../README.md"
keywords = ["storage", "sync", "telegram"]
categories = ["filesystem"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(reqwest_unstable)'] }

[features]
default = ["watcher", "http3-client"]
watcher = ["dep:notify"]
http3-client = ["reqwest/http3"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
futures = "0.3"
hex = "0.4"
log = "0.4"
notify = { version = "6", optional = true, default-features = true }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
x509-parser = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
